[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dm-workshop"
version = "0.1.0"
description = "Local D&D 5e campaign state and rules service for humans and AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "mcp>=2.0,<3",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.4"]

[project.scripts]
dm-workshop = "dm_workshop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dm_workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
